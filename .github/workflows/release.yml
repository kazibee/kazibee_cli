name: Release

on:
  push:
    branches:
      - release

permissions:
  contents: write

env:
  AWS_REGION: ca-central-1
  KAZIBEE_RELEASE_BUCKET: kazibee

jobs:
  release:
    name: Build and release
    runs-on: [self-hosted, macOS, ARM64, simona]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs first so a forgotten version bump fails in seconds instead of
      # overwriting an already-published release and the `latest` assets.
      - name: Require an unreleased version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -n 1)"
          if [ -z "${VERSION}" ]; then
            echo "::error::Could not read the version from package.json."
            exit 1
          fi
          RELEASE_NAME="v${VERSION}"

          if gh release view "${RELEASE_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::Release ${RELEASE_NAME} already exists. Bump the version in package.json before pushing to release."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_NAME}" >/dev/null 2>&1; then
            echo "::error::Tag ${RELEASE_NAME} already exists. Bump the version in package.json before pushing to release."
            exit 1
          fi

          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "RELEASE_NAME=${RELEASE_NAME}" >> "${GITHUB_ENV}"
          echo "Releasing ${RELEASE_NAME}"

      - name: Trust GitHub SSH host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run lint

      - name: Test
        run: bun test

      - name: Build bundled package
        run: bun run build

      - name: Build release binaries
        run: |
          mkdir -p release/bin

          bun build --compile --target=bun-darwin-arm64 src/index.ts --outfile release/bin/kazibee-macos-arm64
          bun build --compile --target=bun-darwin-x64 src/index.ts --outfile release/bin/kazibee-macos-x64
          bun build --compile --target=bun-linux-arm64 src/index.ts --outfile release/bin/kazibee-linux-arm64
          bun build --compile --target=bun-linux-x64 src/index.ts --outfile release/bin/kazibee-linux-x64
          bun build --compile --target=bun-windows-x64 src/index.ts --outfile release/bin/kazibee-windows-x64.exe

          chmod +x release/bin/kazibee-macos-arm64
          chmod +x release/bin/kazibee-macos-x64
          chmod +x release/bin/kazibee-linux-arm64
          chmod +x release/bin/kazibee-linux-x64

      - name: Smoke test native macOS binary
        run: |
          case "$(uname -m)" in
            arm64) BIN=release/bin/kazibee-macos-arm64 ;;
            x86_64) BIN=release/bin/kazibee-macos-x64 ;;
            *) echo "Unsupported macOS architecture: $(uname -m)" && exit 1 ;;
          esac
          "${BIN}" --help
          # The package contract is embedded at build time; the binary must print it.
          "${BIN}" spec | grep -q "Kazibee Extension Package Contract"

      - name: Package release assets
        run: |
          mkdir -p release/assets
          mkdir -p release/latest

          tar -czf "release/assets/kazibee-macos-arm64-${RELEASE_NAME}.tar.gz" -C release/bin kazibee-macos-arm64
          tar -czf "release/assets/kazibee-macos-x64-${RELEASE_NAME}.tar.gz" -C release/bin kazibee-macos-x64
          tar -czf "release/assets/kazibee-linux-arm64-${RELEASE_NAME}.tar.gz" -C release/bin kazibee-linux-arm64
          tar -czf "release/assets/kazibee-linux-x64-${RELEASE_NAME}.tar.gz" -C release/bin kazibee-linux-x64
          zip -j "release/assets/kazibee-windows-x64-${RELEASE_NAME}.zip" release/bin/kazibee-windows-x64.exe

          shasum -a 256 release/assets/* > release/assets/SHA256SUMS

          cp "release/assets/kazibee-macos-arm64-${RELEASE_NAME}.tar.gz" release/latest/kazibee-macos-arm64.tar.gz
          cp "release/assets/kazibee-macos-x64-${RELEASE_NAME}.tar.gz" release/latest/kazibee-macos-x64.tar.gz
          cp "release/assets/kazibee-linux-arm64-${RELEASE_NAME}.tar.gz" release/latest/kazibee-linux-arm64.tar.gz
          cp "release/assets/kazibee-linux-x64-${RELEASE_NAME}.tar.gz" release/latest/kazibee-linux-x64.tar.gz
          cp "release/assets/kazibee-windows-x64-${RELEASE_NAME}.zip" release/latest/kazibee-windows-x64.zip
          cp release/assets/SHA256SUMS release/latest/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create-only: fails instead of replacing assets if the release appeared mid-run.
          gh release create "${RELEASE_NAME}" release/assets/* \
            --target "${GITHUB_SHA}" \
            --title "kazibee ${RELEASE_NAME}" \
            --notes "Automated kazibee ${RELEASE_NAME} release from branch ${GITHUB_REF_NAME} at ${GITHUB_SHA}."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install AWS CLI
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            brew install awscli
          fi

      - name: Upload release assets to S3
        run: |
          aws --version

          aws s3 sync release/assets "s3://${KAZIBEE_RELEASE_BUCKET}/cli/${RELEASE_NAME}/" \
            --only-show-errors

          aws s3 sync release/latest "s3://${KAZIBEE_RELEASE_BUCKET}/cli/latest/" \
            --only-show-errors
