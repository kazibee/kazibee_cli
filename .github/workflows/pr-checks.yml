name: PR Checks

# Pull requests into main, on Kazibee-hosted runners (one Fargate Linux task
# per job; label format kazibee-<cpu>cpu-<memory>gb). Modelled on
# kazibee/websites pr-checks.yml. The release workflow is unchanged and stays
# on the macOS runner.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: kazibee-1cpu-2gb
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: typecheck
            command: bun run lint
          - check: build
            command: bun run build
          - check: test
            command: bun test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ${{ matrix.check }}
        env:
          CHECK_COMMAND: ${{ matrix.command }}
        run: bash -c "$CHECK_COMMAND"
